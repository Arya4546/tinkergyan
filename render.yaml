services:
  - type: web
    name: tinkergyan-api
    runtime: node
    buildCommand: chmod +x scripts/setup-arduino-cli.sh && ./scripts/setup-arduino-cli.sh && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: tinkergyan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://tinkergyan-web.vercel.app

databases:
  - name: tinkergyan-db
    plan: free
    region: oregon # Or your preferred region
