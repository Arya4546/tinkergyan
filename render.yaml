services:
  - type: web
    name: tinkergyan-api
    runtime: node
    buildCommand: chmod +x scripts/setup-arduino-cli.sh && ./scripts/setup-arduino-cli.sh && pnpm install && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: tinkergyan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://tinkergyan-web.vercel.app
      - key: ARDUINO_CLI_PATH
        value: /opt/render/project/src/bin/arduino-cli
      - key: ARDUINO_DIRECTORIES_DATA
        value: /opt/render/project/src/bin/arduino-cli-data
      - key: ARDUINO_DIRECTORIES_USER
        value: /opt/render/project/src/bin/arduino-cli-user
      - key: ARDUINO_DIRECTORIES_DOWNLOADS
        value: /opt/render/project/src/bin/arduino-cli-downloads

databases:
  - name: tinkergyan-db
    plan: free
    region: oregon # Or your preferred region
